<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keyword Library — Visual Reference</title>
  <meta name="description" content="A personal visual reference of technique keywords for image, video, and motion prompting." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>Keyword Library</h1>
      <p class="tagline">A visual reference of technique keywords. See the look, grab the word.</p>
    </div>
  </header>

  <div class="controls wrap">
    <div class="filters" id="filters">
      <!-- category buttons injected by app.js -->
    </div>
    <div class="search-box">
      <input type="search" id="search" placeholder="Search keywords or tags…" autocomplete="off" />
    </div>
  </div>

  <main class="wrap">
    <p class="count" id="count"></p>
    <section class="grid" id="grid" aria-live="polite">
      <!-- cards injected by app.js -->
    </section>
    <p class="empty" id="empty" hidden>No keywords match. Try a different search or category.</p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Add a keyword: drop an image in <code>images/</code> and add an entry to <code>data.json</code>.
        See the <a href="glossary.html">full glossary</a> for every term in one list.</p>
    </div>
  </footer>

  <!-- Lightbox / detail modal -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-keyword">
      <button class="modal-close" data-close aria-label="Close">×</button>
      <div class="modal-media" id="modal-media"></div>
      <div class="modal-body">
        <span class="badge" id="modal-category"></span>
        <h2 id="modal-keyword"></h2>
        <p id="modal-note"></p>
        <div class="modal-tags" id="modal-tags"></div>
        <button class="copy-btn" id="modal-copy">Copy keyword</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
